<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A87FF"/>
      <stop offset="48%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#3B2ED0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#sheen)"/>

  <!-- Squeezed onto a plate: two chevrons pressing toward a centre bar.
       Kept crisp and widely spaced so it survives down to 16px. -->
  <g stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="348,300 512,414 676,300"/>
    <polyline points="348,724 512,610 676,724"/>
  </g>
  <rect x="336" y="478" width="352" height="68" rx="34" fill="#FFFFFF"/>
</svg>
