<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="glow" cx="50%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="#0B0C12"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- App mark, scaled from the icon's own geometry -->
  <g transform="translate(569, 108) scale(0.15)">
    <rect x="64" y="64" width="896" height="896" rx="232" fill="#5865F2"/>
    <g stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="348,300 512,414 676,300"/>
      <polyline points="348,724 512,610 676,724"/>
    </g>
    <rect x="336" y="478" width="352" height="68" rx="34" fill="#FFFFFF"/>
  </g>

  <text x="640" y="330" text-anchor="middle" fill="#EDEEF4"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="-0.5">Send to Nitrate</text>

  <text x="640" y="380" text-anchor="middle" fill="#9BA0B4"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="25">One click from the page you're already on — no copying, no pasting.</text>

  <!-- The button the extension adds -->
  <g transform="translate(540, 432)">
    <rect width="200" height="56" rx="28" fill="#5865F2"/>
    <g transform="translate(34, 20) scale(0.68)" stroke="#FFFFFF" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="7,5 12,9 17,5"/>
      <polyline points="7,19 12,15 17,19"/>
    </g>
    <rect x="27.2" y="39" width="16.3" height="3.3" rx="1.6" fill="#FFFFFF"/>
    <text x="118" y="36" text-anchor="middle" fill="#FFFFFF"
          font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="23" font-weight="650">Nitrate</text>
  </g>

  <!-- Supported sites -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21"
     font-weight="600" fill="#9BA0B4" text-anchor="middle">
    <g transform="translate(340, 560)">
      <rect x="-78" y="-27" width="156" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.055"/>
      <text y="8">YouTube</text>
    </g>
    <g transform="translate(490, 560)">
      <rect x="-62" y="-27" width="124" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.055"/>
      <text y="8">X</text>
    </g>
    <g transform="translate(660, 560)">
      <rect x="-92" y="-27" width="184" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.055"/>
      <text y="8">Instagram</text>
    </g>
    <g transform="translate(830, 560)">
      <rect x="-72" y="-27" width="144" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.055"/>
      <text y="8">Reddit</text>
    </g>
    <g transform="translate(980, 560)">
      <rect x="-68" y="-27" width="136" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.055"/>
      <text y="8">Twitch</text>
    </g>
  </g>

  <text x="640" y="678" text-anchor="middle" fill="#6B7086"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20">
    Requires the free Nitrate desktop app · Nothing is collected · Open source
  </text>
</svg>
