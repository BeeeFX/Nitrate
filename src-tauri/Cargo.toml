[package]
name = "nitrate"
version = "0.8.5"
description = "Drag, drop, done. Compress any video to fit Discord's upload limits."
authors = ["Nitrate contributors"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/BeeeFX/Nitrate"

[lib]
name = "nitrate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the editor play the source file directly, rather than
# stepping through stills. Its scope stays empty and is opened per file.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only used to fetch yt-dlp; the version matches what the updater plugin
# already pulls in, so it costs no extra compilation.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
tauri-plugin-drag = "2.1.1"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
# Hides the console window that would otherwise flash on every ffmpeg invocation.
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
