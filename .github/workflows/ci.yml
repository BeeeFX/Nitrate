name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and typecheck
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cargo's registry and the build tree dominate CI time otherwise.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Also fetches the ffmpeg sidecars via postinstall — the Rust build
      # won't even configure without them.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run check

      - name: Build frontend
        run: npx vite build

      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # These drive real ffmpeg and assert the output lands under target.
      - name: Encoder tests
        working-directory: src-tauri
        run: cargo test --all
