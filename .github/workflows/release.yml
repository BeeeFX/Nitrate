name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

          # Linux builds from the same source and should work, but has never
          # been run. Enable it once someone has actually launched the result.
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   args: ""

          # macOS needs work before it can ship. `scripts/fetch-ffmpeg.mjs`
          # only has an x86_64 source (evermeet.cx publishes nothing for arm64),
          # so an aarch64 build would bundle an Intel ffmpeg — that compiles
          # cleanly and then fails on the user's machine. Find an arm64 ffmpeg
          # build, or drop the aarch64 target and rely on Rosetta, first.
          # - platform: macos-latest
          #   target: x86_64-apple-darwin
          #   args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install dependencies
        run: npm ci
        env:
          # Cross-compiling on macOS needs the sidecars for the *target* arch,
          # not the runner's.
          NITRATE_TARGET: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still produces
          # an installer, but auto-update will reject it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nitrate ${{ github.ref_name }}"
          releaseBody: |
            Drop a video, get it back under Discord's limit.

            **Windows:** download the `.exe` installer below.

            Bundled ffmpeg is GPL v3 — see THIRD-PARTY.md.
          # Draft so a broken build can't ship itself. Note that auto-update
          # only sees the release once it's published.
          releaseDraft: true
          prerelease: false
          # Emits latest.json, which the updater endpoint points at.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # tauri-action also uploads a standalone .sig for each installer. The
      # updater never fetches it — the signature it checks is embedded in
      # latest.json — so on the release page it's just an unexplained 0 KB file
      # next to the thing people actually want to download.
      #
      # This runs immediately after the build, before anything else that could
      # fail: tidying the release shouldn't be hostage to a later step.
      - name: Drop the redundant signature files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --json assets \
            --jq '.assets[].name | select(endswith(".sig"))' |
          while read -r asset; do
            echo "removing $asset"
            gh release delete-asset "${{ github.ref_name }}" "$asset" --yes
          done

      # Platform-independent, so only one job in the matrix builds it.
      - name: Attach the browser extension
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run extension
          gh release upload "${{ github.ref_name }}" \
            extension/dist/nitrate-extension-*.zip --clobber
